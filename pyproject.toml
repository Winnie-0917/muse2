# 專案設定與相依套件（取代原本的 requirements.txt）。
#
# 安裝（建議在虛擬環境內，以可編輯模式安裝，之後改程式碼免重裝）：
#     python3 -m venv venv
#     source venv/bin/activate
#     pip install -e .
#
# 安裝後即可用：
#     python -m signal_monitor                         # 互動式控制台（原 main.py）
#     signal-monitor                                    # 同上，console script
#     python -m signal_monitor.overall_process --seconds 60
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-monitor"
version = "0.1.0"
description = "MUSE 2 原始 EEG 擷取、每秒 FFT、專注度指數 EI 與前額 alpha 不對稱 FAA"
readme = "README.md"
# 3.10 是相依套件的實際下限（bleak >=3.10），也是型別標註用 `X | None`
# （PEP 604）所需的版本。注意 numpy/scipy 的新版另外要求 >=3.12，
# 在 3.10/3.11 上 pip 會自動退回較舊但相容的版本。
requires-python = ">=3.10"
dependencies = [
    "muselsl",   # MUSE 串流層（會一併安裝 pylsl）
    "bleak",     # Linux 原生 BLE 後端（BlueZ / D-Bus，免額外驅動）
    "numpy",     # 陣列運算 + 即時監控統計 + 每秒 FFT 分析
    "scipy",         # 眨眼偵測的帶通濾波與波峰偵測
    "pandas",        # Model/ 讀取特徵 CSV
    "scikit-learn",  # Model/ 邏輯迴歸分類器
    "joblib",        # Model/ 模型序列化
]

[project.scripts]
# 安裝後可直接用 `signal-monitor` 開啟互動式控制台
signal-monitor = "signal_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
